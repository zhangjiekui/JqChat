[completion]
provider = "r2r"
concurrent_request_limit = 128

[ingestion]
provider = "jq"
document_summary_model = "openai/Qwen25B32"
vision_img_model = "openai/qwenvl"
vision_pdf_model = "openai/qwenvl"
chunking_strategy = "jq"
chunk_size = 512
chunk_overlap = 100
excluded_parsers = ["mp4"]
skip_document_summary = true
automatic_extraction = true # enable automatic extraction of entities and relations
  [ingestion.chunk_enrichment_settings]
    chunk_enrichment_prompt = "chunk_enrichment"
    enable_chunk_enrichment = false    
    n_chunks = 2
  [ingestion.extra_parsers]
    pdf = "zerox"

[orchestration]
provider = "hatchet"
kg_creation_concurrency_limit = 32
ingestion_concurrency_limit = 16
kg_concurrency_limit = 8
